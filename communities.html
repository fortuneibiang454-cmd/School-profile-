<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Community - StudentConnect</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav>
    <h2>StudentConnect</h2>

    <div>
      <a href="dashboard.html">Home</a>
      <a href="discover.html">Discover</a>
      <a href="messages.html">Messages</a>
      <a href="communities.html">Communities</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <main class="community-page">

    <section class="community-header">

      <h1 id="communityTitle">
        Community
      </h1>

      <p id="communityDescription">
        Welcome to this community.
      </p>

    </section>


    <section class="community-post-box">

      <h2>💬 Start a Discussion</h2>

      <textarea
        id="postInput"
        placeholder="Share something with the community..."
        maxlength="500"
      ></textarea>

      <button
        id="postButton"
        class="btn"
        type="button"
      >
        Post
      </button>

    </section>


    <section class="community-posts">

      <h2>📢 Discussions</h2>

      <div id="postsList">
        <p>Loading discussions...</p>
      </div>

    </section>

  </main>


  <script type="module" src="js/community.js"></script>

</body>
  </html>
