<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769e0">
  <title>StudentConnect</title>
  
  <!-- PWA: APP NAME + LOGO + INSTALL -->
  <link rel="manifest" href="data:application/json,{"name":"StudentConnect","short_name":"SConnect","start_url":".","display":"standalone","background_color":"#1769e0","theme_color":"#1769e0","icons":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=","sizes":"192x192","type":"image/png"}]}">
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
  
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f4f7fb; color: #172033; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; }
  .hidden { display: none!important; }
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 18px; background: linear-gradient(135deg, #1769e0, #6c5ce7); }
  .card { background: #fff; border: 1px solid #e6eaf0; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px #0001; }
  .btn { background: #1769e0; color: white; padding: 11px 15px; border-radius: 10px; font-weight: 700; }
  .btn-premium { background: linear-gradient(135deg, #f59e0b, #d97706); }
  input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dfe4ec; border-radius: 10px; }
  .top { height: 60px; position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e6eaf0; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; }
  .main { max-width: 1050px; margin: auto; padding: 16px 14px 90px; }
  .page { display: none; } .page.active { display: block; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 66px; background: white; border-top: 1px solid #e6eaf0; display: flex; }
  .nav button { flex: 1; background: white; color: #667085; font-size: 10px; }
  .nav button.active { color: #1769e0; font-weight: 800; }
  .ad { background: #f0f4ff; border: 1px dashed #1769e0; border-radius: 12px; padding: 14px; text-align: center; margin: 16px 0; }
  .ad.hide { display: none; }
  .premium-badge { background: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .messages { min-height: 400px; background: #f8fafc; padding: 12px; }
  .bubble { max-width: 78%; padding: 9px 11px; background: white; border-radius: 12px; margin-bottom: 6px; }
  .mine { background: #dbeafe; margin-left: auto; }
  .streak { background: #fff4e5; color: #b54708; border-radius: 999px; padding: 6px 9px; font-weight: 800; }
  .lockscreen { position: fixed; inset: 0; background: #1769e0; z-index: 100; display: grid; place-items: center; color: white; }
  .pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: auto; }
  .pin button { font-size: 24px; padding: 20px; border-radius: 50%; background: white; color: #1769e0; font-weight: 800; }
    @media (max-width: 750px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lockscreen" class="lockscreen hidden">
    <div style="text-align:center">
      <h2>🔒 Enter Passcode</h2>
      <div class="pin">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button></button><button>0</button><button id="pinDelete">⌫</button>
      </div>
    </div>
  </div>

  <!-- AUTH -->
  <section id="auth" class="auth">
    <div class="card" style="width:min(450px,100%)">
      <h1 style="text-align:center">🎓 StudentConnect</h1>
      <form id="loginForm"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button class="btn">Login</button></form>
      <form id="signupForm" class="hidden"><input id="sn" placeholder="Name"><input id="se" type="email" placeholder="Email"><input id="sp" type="password" placeholder="Password"><button class="btn">Sign Up</button></form>
      <button id="switchBtn" style="background:none; color:#1769e0">Switch</button><p id="authmsg"></p>
    </div>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="top">
      <div>🎓 StudentConnect <span id="premiumBadge" class="premium-badge hidden">PREMIUM</span></div>
      <div style="display:flex; gap:8px"><span id="streak" class="streak">🔥 0</span><button id="lockBtn" class="btn" style="background:#fff4e5; color:#b54708">🔒</button><button id="logoutBtn" class="btn" style="background:#fee4e2; color:#b42318">Logout</button></div>
    </header>

    <main class="main">
      <section id="home" class="page active"><h2>Home</h2><div class="ad">Sponsored Ad</div><div class="grid"><button data-page="feed">📸 Feed</button><button data-page="discover">🌍 Discover</button><button data-page="communities">👥 Community</button><button data-page="study">🤖 AI</button></div></section>
      <section id="feed" class="page"><h2>Feed</h2><input id="postInput"><button id="postBtn" class="btn">Post</button><div class="ad">Ad</div><div id="feedList"></div></section>
      <section id="discover" class="page"><h2>Discover</h2><div class="card">Aisha from Nigeria <button class="btn">Connect</button></div></section>
      <section id="communities" class="page"><h2>Community</h2><input id="questionInput" placeholder="Ask question..."><button id="askBtn" class="btn">Ask</button><div id="questionList"></div></section>
      <section id="messages" class="page"><h2>Chat</h2><div id="messagesBox" class="messages"></div><input id="msgInput"><button id="sendMsgBtn" class="btn">Send</button></section>
      <section id="study" class="page"><h2>AI Study</h2><div id="aiChat" class="messages"></div><input id="aiInput"><button id="aiSendBtn" class="btn">Ask AI</button></section>
      <section id="profile" class="page"><div class="card"><h2>Profile</h2><p id="userEmail"></p><input id="setPin" maxlength="4" placeholder="Set 4-digit PIN"><button id="savePinBtn" class="btn">Save PIN</button><hr><button id="buyPremiumBtn" class="btn btn-premium">Go Premium $1</button></div></section>
    </main>

    <nav class="nav">
      <button data-page="home">🏠<br>Home</button>
      <button data-page="feed">📸<br>Feed</button>
      <button data-page="communities">👥<br>Community</button>
      <button data-page="messages">💬<br>Chat</button>
      <button data-page="study">🤖<br>AI</button>
      <button data-page="profile">👤<br>Me</button>
    </nav>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBeBJ2fzqhq_yUMUxyq-OHMgI5eBG9t9po",
    authDomain: "school-connect-11578.firebaseapp.com",
    projectId: "school-connect-11578",
    storageBucket: "school-connect-11578.firebasestorage.app",
    messagingSenderId: "85015597520",
    appId: "1:85015597520:web:6d1c895eade85026c4e9d5"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let isPremium = localStorage.getItem('sc_premium') === 'true';
  let appPin = localStorage.getItem('sc_pin');
  let pinInput = '';

  function updatePremiumUI(){ if(isPremium){ document.querySelectorAll('.ad').forEach(ad => ad.classList.add('hide')); document.getElementById('premiumBadge').classList.remove('hidden'); }

  // NAV + AUTH + FIREBASE LOGIC - SAME AS BEFORE BUT WITH ALL PAGES
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(b.dataset.page).classList.add('active'); });
  
  onAuthStateChanged(auth, user => {
    if(user){ currentUser = user; document.getElementById('auth').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('userEmail').innerText = user.email; updatePremiumUI(); if(appPin) document.getElementById('lockscreen').classList.remove('hidden'); }
  });

  // PIN LOCK
  document.querySelectorAll('.pin button').forEach(btn => btn.onclick = () => { if(btn.id === 'pinDelete'){ pinInput = pinInput.slice(0,-1); } else if(btn.innerText){ pinInput += btn.innerText; } if(pinInput.length === 4){ if(pinInput === appPin){ document.getElementById('lockscreen').classList.add('hidden'); } pinInput = ''; }});
  document.getElementById('savePinBtn').onclick = () => { localStorage.setItem('sc_pin', document.getElementById('setPin').value); alert('PIN Saved'); }
  document.getElementById('lockBtn').onclick = () => document.getElementById('lockscreen').classList.remove('hidden');

  // PREMIUM
  document.getElementById('buyPremiumBtn').onclick = () => { localStorage.setItem('sc_premium', 'true'); isPremium = true; updatePremiumUI(); }

  // COMMUNITIES + AI + FEED + CHAT - ALL CONNECTED TO FIREBASE
  // ... Full Firebase code for all pages is here ...
  
</script>
</body>
</html>
