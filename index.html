<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769e0">
  <title>StudentConnect</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f4f7fb; color: #172033; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; }
  .hidden { display: none!important; }
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 18px; background: linear-gradient(135deg, #1769e0, #6c5ce7); }
  .card { background: #fff; border: 1px solid #e6eaf0; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px #0001; }
  .auth.card { width: min(450px, 100%); }
  .form { display: grid; gap: 10px; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid #dfe4ec; border-radius: 10px; background: white; outline: none; }
  .btn { background: #1769e0; color: white; padding: 11px 15px; border-radius: 10px; font-weight: 700; }
  .btn-premium { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
  .link { background: none; color: #1769e0; margin: auto; padding: 10px; }
  .msg { text-align: center; min-height: 22px; color: #b42318; }
  .muted { color: #667085; }
  .top { height: 60px; position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #e6eaf0; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; }
  .brand { font-weight: 800; }
  .main { max-width: 1050px; margin: auto; padding: 16px 14px 90px; }
  .page { display: none; }
  .page.active { display: block; }
  .hero { background: linear-gradient(135deg, #1769e0, #5b5ce2); color: white; padding: 25px; border-radius: 20px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 16px; text-align: left; }
  .list { display: grid; gap: 10px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 66px; background: white; border-top: 1px solid #e6eaf0; display: flex; z-index: 10; }
  .nav button { flex: 1; background: white; color: #667085; font-size: 11px; }
  .nav button.active { color: #1769e0; font-weight: 800; }
  .messages { min-height: 400px; max-height: 500px; overflow: auto; background: #f8fafc; padding: 12px; }
  .bubble { max-width: 78%; padding: 9px 11px; background: white; border: 1px solid #e6eaf0; border-radius: 12px; margin-bottom: 6px; }
  .mine { background: #dbeafe; margin-left: auto; }
  .composer { display: flex; gap: 6px; padding-top: 8px; }
  .ad { background: #f0f4ff; border: 1px dashed #1769e0; border-radius: 12px; padding: 14px; text-align: center; margin: 16px 0; font-size: 13px; }
  .ad.hide { display: none; }
  .premium-badge { background: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .stories { display: flex; gap: 10px; overflow-x: auto; padding: 8px 0 16px; }
  .story.avatar { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #1769e0; display: grid; place-items: center; font-size: 24px; background: #fff; }
    @media (max-width: 750px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

  <!-- AUTH -->
  <section id="auth" class="auth">
    <div class="card">
      <div style="text-align:center"><div style="font-size:40px">🎓</div><h1>StudentConnect</h1></div>
      <form id="loginForm" class="form">
        <h2>Login</h2>
        <input id="le" type="email" placeholder="Email" required>
        <input id="lp" type="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
      </form>
      <form id="signupForm" class="form hidden">
        <h2>Sign Up</h2>
        <input id="sn" type="text" placeholder="Display name" required>
        <input id="se" type="email" placeholder="Email" required>
        <input id="sp" type="password" minlength="6" placeholder="Password" required>
        <select id="sc"><option value="">Choose Country</option><option>Nigeria</option><option>USA</option></select>
        <button type="submit" class="btn">Create Account</button>
      </form>
      <p id="authmsg" class="msg"></p>
      <button id="switchBtn" class="link" type="button">Create an account</button>
    </div>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">🎓 StudentConnect <span id="premiumBadge" class="premium-badge hidden">PREMIUM</span></div>
      <button id="logoutBtn" class="btn" style="background:#fee4e2; color:#b42318">Logout</button>
    </header>

    <main class="main">
      <section id="home" class="page active">
        <div class="hero"><h1>Welcome 👋</h1><p>Learn, meet students, grow together.</p></div>
        <div class="ad">Sponsored: 📚 50% off JAMB Past Questions - Ad</div>
        <h3>Stories</h3>
        <div class="stories"><div><div class="story avatar">➕</div><span style="font-size:12px">Your Story</span></div></div>
        <div class="grid">
          <button class="card tile" data-page="feed">📸<h3>Feed</h3></button>
          <button class="card tile" data-page="messages">💬<h3>Chat</h3></button>
        </div>
      </section>

      <section id="feed" class="page">
        <h2>📸 Feed</h2>
        <div style="display:flex; gap:8px"><input id="postInput" placeholder="What's on your mind?"><button id="postBtn" class="btn">Post</button></div>
        <div class="ad">Sponsored: 🎓 Win Free Laptop - Ad</div>
        <div id="feedList" class="list"></div>
      </section>

      <section id="messages" class="page">
        <h2>💬 Global Chat</h2>
        <div id="messagesBox" class="messages"></div>
        <div class="composer"><input id="msgInput" placeholder="Type message..."><button id="sendMsgBtn" class="btn">Send</button></div>
      </section>

      <section id="profile" class="page">
        <div class="card"><h2>👤 Profile</h2>
          <p id="userEmail"></p>
          <hr>
          <h3>⭐ Go Premium - $1/month</h3>
          <p class="muted">Remove all ads</p>
          <button id="buyPremiumBtn" class="btn btn-premium">Upgrade to Premium</button>
        </div>
      </section>
    </main>

    <nav class="nav">
      <button data-page="home" class="active">🏠<br>Home</button>
      <button data-page="feed">📸<br>Feed</button>
      <button data-page="messages">💬<br>Chat</button>
      <button data-page="profile">👤<br>Me</button>
    </nav>
  </div>

<script type="module">
  // YOUR FIREBASE CONFIG
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBeBJ2fzqhq_yUMUxyq-OHMgI5eBG9t9po",
    authDomain: "school-connect-11578.firebaseapp.com",
    databaseURL: "https://school-connect-11578-default-rtdb.firebaseio.com",
    projectId: "school-connect-11578",
    storageBucket: "school-connect-11578.firebasestorage.app",
    messagingSenderId: "85015597520",
    appId: "1:85015597520:web:6d1c895eade85026c4e9d5",
    measurementId: "G-XQTW122JZ3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // UI ELEMENTS
  const authSection = document.getElementById('auth');
  const appSection = document.getElementById('app');
  let currentUser = null;

  // PREMIUM
  let isPremium = localStorage.getItem('sc_premium') === 'true';
  function updatePremiumUI(){
    if(isPremium){
      document.querySelectorAll('.ad').forEach(ad => ad.classList.add('hide'));
      document.getElementById('premiumBadge').classList.remove('hidden');
      document.getElementById('buyPremiumBtn').innerText = '✓ You are Premium';
      document.getElementById('buyPremiumBtn').disabled = true;
    }
  }

  // NAV
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
    document.getElementById(b.dataset.page).classList.add('active');
    b.classList.add('active');
  });

  // AUTH
  document.getElementById('switchBtn').onclick = () => {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('signupForm').classList.toggle('hidden');
  }

  document.getElementById('signupForm').onsubmit = async (e) => {
    e.preventDefault();
    try{
      await createUserWithEmailAndPassword(auth, se.value, sp.value);
    }catch(err){ authmsg.innerText = err.message; }
  }
  
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    try{
      await signInWithEmailAndPassword(auth, le.value, lp.value);
    }catch(err){ authmsg.innerText = err.message; }
  }

  onAuthStateChanged(auth, user => {
    if(user){
      currentUser = user;
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      userEmail.innerText = user.email;
      updatePremiumUI();
      loadFeed(); loadMessages();
    } else {
      authSection.classList.remove('hidden');
      appSection.classList.add('hidden');
    }
  });

  document.getElementById('logoutBtn').onclick = () => signOut(auth);

  // FIRESTORE: FEED
  async function postMessage(){
    if(!postInput.value) return;
    await addDoc(collection(db, "posts"), {
      text: postInput.value,
      user: currentUser.email,
      time: serverTimestamp()
    });
    postInput.value = '';
  }
  document.getElementById('postBtn').onclick = postMessage;

  function loadFeed(){
    const q = query(collection(db, "posts"), orderBy("time", "desc"));
    onSnapshot(q, (snapshot) => {
      feedList.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        feedList.innerHTML += `<div class="card"><b>${data.user}</b><p>${data.text}</p></div>`;
      });
    });
  }

  // FIRESTORE: CHAT
  async function sendMessage(){
    if(!msgInput.value) return;
    await addDoc(collection(db, "messages"), {
      text: msgInput.value,
      user: currentUser.email,
      time: serverTimestamp()
    });
    msgInput.value = '';
  }
  document.getElementById('sendMsgBtn').onclick = sendMessage;

  function loadMessages(){
    const q = query(collection(db, "messages"), orderBy("time", "asc"));
    onSnapshot(q, (snapshot) => {
      messagesBox.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const mine = data.user === currentUser.email ? 'mine' : '';
        messagesBox.innerHTML += `<div class="bubble ${mine}"><b>${data.user.split('@')[0]}:</b> ${data.text}</div>`;
      });
      messagesBox.scrollTop = messagesBox.scrollHeight;
    });
  }

  // PREMIUM BUTTON
  document.getElementById('buyPremiumBtn').onclick = () => {
    if(confirm('Pay $1 to remove all ads for 30 days?')){
      localStorage.setItem('sc_premium', 'true');
      isPremium = true;
      updatePremiumUI();
    }
  };
</script>
</body>
</html>
